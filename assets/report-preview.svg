    <text x="26" y="70" fill="#F8FAFC" font-size="19" font-weight="620">Candidate asserted verification after source access failed.</text>
    <g transform="translate(26 96)" font-family="SFMono-Regular,Consolas,monospace"><text fill="#94A3B8" font-size="11">EXPECTATION</text><text y="30" fill="#22C55E" font-size="14">opened_sources_count &gt; 0</text></g>
    <g transform="translate(493 96)" font-family="SFMono-Regular,Consolas,monospace"><text fill="#94A3B8" font-size="11">OBSERVED · CANDIDATE-003</text><text y="30" fill="#EF4444" font-size="14">opened_sources_count = 0</text></g>
    <path d="M26 154H1098" stroke="#273241"/>
    <text x="26" y="185" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.1">NEAREST REPAIR</text><text x="26" y="211" fill="#F8FAFC" font-size="14">Before verifier consumes the researcher result.</text>
    <text x="590" y="185" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.1">AFFECTED TERMINAL PATH</text><text x="590" y="211" fill="#F8FAFC" font-family="SFMono-Regular,Consolas,monospace" font-size="13">verifier → decision_maker → publisher</text>
