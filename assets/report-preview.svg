<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GraphABI trace-backed compatibility report</title>
  <desc id="desc">The report shows structural compatibility passing, semantic compatibility breaking, the first broken edge, its witness, downstream path, and repair location.</desc>
  <rect width="1200" height="720" rx="18" fill="#0B0F14"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#273241" stroke-width="2"/>
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
