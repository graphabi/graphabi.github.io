    <text x="38" y="99" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1.4">RESEARCH_DEMO · CANDIDATE-003 · REPORT 0.1</text>
    <text x="38" y="138" fill="#F8FAFC" font-size="28" font-weight="650">The schema passed. Meaning broke at the first edge.</text>
    <g transform="translate(38 165)"><rect width="225" height="78" rx="10" fill="#101C17" stroke="#205E39"/><text x="16" y="27" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">STRUCTURAL</text><text x="16" y="58" fill="#22C55E" font-family="SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">✓ PASS</text></g>
    <g transform="translate(279 165)"><rect width="225" height="78" rx="10" fill="#211315" stroke="#6F2429"/><text x="16" y="27" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">SEMANTIC</text><text x="16" y="58" fill="#EF4444" font-family="SFMono-Regular,Consolas,monospace" font-size="19" font-weight="700">× BREAKING</text></g>
    <g transform="translate(520 165)"><rect width="642" height="78" rx="10" fill="#121820" stroke="#273241"/><text x="16" y="27" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1.1">FIRST BREAKING EDGE</text><text x="16" y="58" fill="#F8FAFC" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="700">researcher → verifier</text><text x="590" y="55" text-anchor="end" fill="#EF4444" font-size="11" font-weight="700">3 BREAKING</text></g>
  </g>
  <g transform="translate(38 290)" font-family="SFMono-Regular,Consolas,monospace">
    <path d="M190 48H280M456 48H546M746 48H836" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 7" opacity=".75"/>
    <g><rect width="190" height="96" rx="10" fill="#121820" stroke="#556070"/><text x="16" y="48" fill="#F8FAFC" font-size="14" font-weight="700">researcher</text><text x="16" y="70" fill="#94A3B8" font-size="10">producer</text></g>
    <g transform="translate(280)"><rect width="176" height="96" rx="10" fill="#1C1418" stroke="#EF4444" stroke-width="2"/><text x="16" y="48" fill="#F8FAFC" font-size="14" font-weight="700">verifier</text><text x="16" y="70" fill="#EF4444" font-size="10">direct impact</text></g>
    <g transform="translate(546)"><rect width="200" height="96" rx="10" fill="#17171C" stroke="#66363B"/><text x="16" y="48" fill="#F8FAFC" font-size="14" font-weight="700">decision_maker</text><text x="16" y="70" fill="#EF8080" font-size="10">transitive</text></g>
    <g transform="translate(836)"><rect width="228" height="96" rx="10" fill="#17171C" stroke="#66363B"/><text x="16" y="48" fill="#F8FAFC" font-size="14" font-weight="700">publisher</text><text x="16" y="70" fill="#EF8080" font-size="10">terminal · side effect</text></g>
    <path d="M190 48H254" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/><circle cx="254" cy="48" r="7" fill="#A78BFA"/><g transform="translate(258 35)" stroke="#EF4444" stroke-width="4" stroke-linecap="round"><path d="M0 0L13 11M0 14L13 25"/></g>
